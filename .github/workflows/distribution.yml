name: Distribution PHP et Docker

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/distribution.yml
  workflow_dispatch:
    inputs:
      version:
        description: Version à publier au format vX.Y.Z
        required: true
        default: v1.4.0

permissions:
  contents: write
  packages: write

concurrency:
  group: distribution
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/xeros59/gestion-cdi
      VERSION: ${{ inputs.version || 'v1.4.0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Vérifier la version
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Utiliser le format vX.Y.Z."
            exit 1
          fi

      - name: Vérifier l’archive PHP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php8.3-cli php8.3-sqlite3 php8.3-intl php8.3-mbstring
          python3 scripts/build-dark-theme.py
          git diff --exit-code public/cdi/theme-dark.css || { echo "Relancer scripts/build-dark-theme.py"; exit 1; }
          bash scripts/build-php.sh
          npm install --prefix "$RUNNER_TEMP/tice-layout" --no-save --ignore-scripts playwright-core@1.58.2
          TICECDI_BROWSER="$RUNNER_TEMP/tice-layout/node_modules/playwright-core/index.mjs" \
            TICECDI_CHROME="$(command -v google-chrome)" \
            PHP_BIN=/usr/bin/php8.3 node scripts/smoke-php.mjs dist/TiceCDI-PHP.zip

      - name: Conserver les captures de vérification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ticecdi-rendu
          path: dist/layout/
          retention-days: 1
          if-no-files-found: error

      - name: Construire et tester l’image Docker
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$IMAGE:$VERSION" --tag "$IMAGE:latest" .
          container=$(docker run -d --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -e CDI_SETUP_KEY=controle-local -p 127.0.0.1:19080:8080 "$IMAGE:$VERSION")
          trap 'docker rm -f "$container" >/dev/null' EXIT
          if ! curl --fail --silent --show-error --max-time 3 --retry 20 --retry-all-errors \
            --retry-delay 1 --retry-max-time 25 http://127.0.0.1:19080/healthz; then
            docker logs "$container"
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:19080/ | grep -q '<title>TiceCDI</title>'
          curl --silent --show-error -I http://127.0.0.1:19080/ | grep -qi '^x-frame-options: SAMEORIGIN'
          if docker exec "$container" sh -c 'command -v npm'; then echo "npm ne doit pas être présent dans l’image."; exit 1; fi
          for asset in ticecdi-logo.webp ticecdi-icon.webp; do
            curl --fail --silent --show-error "http://127.0.0.1:19080/cdi/$asset" | cmp "public/cdi/$asset" -
          done
          docker exec "$container" cat /app/LICENSE | cmp LICENSE -
          docker image save "$IMAGE:$VERSION" "$IMAGE:latest" | gzip > dist/TiceCDI-Docker-amd64.tar.gz

      - name: Publier les téléchargements sur GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > dist/NOTES.md
          cd dist
          sha256sum TiceCDI-PHP.zip TiceCDI-Docker-amd64.tar.gz > SHA256SUMS.txt
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "TiceCDI $VERSION" \
              --notes-file NOTES.md \
              TiceCDI-PHP.zip TiceCDI-Docker-amd64.tar.gz SHA256SUMS.txt
          else
            tagged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$VERSION" --jq .sha)
            if [[ "$tagged" != "$GITHUB_SHA" ]]; then
              echo "Cette version désigne déjà un autre commit. Publier avec un nouveau numéro."
              exit 1
            fi
            gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
              TiceCDI-PHP.zip TiceCDI-Docker-amd64.tar.gz SHA256SUMS.txt
          fi

      - name: Publier l’image sur GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:latest"
